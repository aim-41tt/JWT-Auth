spring.application.name=JWT-auth
server.port=8080

# db JPA
spring.datasource.url=${DATABASE_JDBC_URL}
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.consumer.group-id=${CONSUMER_GRUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=500

# redis && cache
spring.data.redis.url=${REDIS_HOST}

spring.cache.type=redis

# ssl
server.ssl.enabled=true
server.ssl.key-store=${KEYSTORE_PATH}
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=${KEYSTORE_TYPE}
server.ssl.key-alias=${KEYSTORE}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXP}

# swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=warn
#logging.level.org.springframework.data.redis=trace
#logging.level.io.lettuce.core=DEBUG

